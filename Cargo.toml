[package]
name         = "persona"
version      = "0.5.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/persona"
description  = "Engine manager and apex integration repo for multi-harness AI systems."

[lib]
name = "persona"
path = "src/lib.rs"

[[bin]]
name = "persona"
path = "src/main.rs"

[[bin]]
name = "persona-daemon"
path = "src/bin/persona_daemon.rs"

[[bin]]
name = "persona-write-configuration"
path = "src/bin/persona_write_configuration.rs"

[dependencies]
kameo                  = { git = "https://github.com/LiGoldragon/kameo.git", rev = "3486e4f63ea4e87123476cfbdefeb12403540306", default-features = false }
datom-codec            = { git = "https://github.com/LiGoldragon/datom-codec", rev = "6dccc76b75918a91d3370a9d4fe88aa7dd567876" }
libc                   = "0.2"
protos                 = { git = "https://github.com/LiGoldragon/protos", rev = "171b21f65337983ab624b7b906397a4f1f92c5a3" }
meta-signal-upgrade    = { git = "https://github.com/LiGoldragon/meta-signal-upgrade.git", rev = "ccccef7facb50dfcfd6a43575b3428feffbfc033", features = ["datom"] }
meta-signal-system    = { git = "https://github.com/LiGoldragon/meta-signal-system.git", rev = "18e9599ea60701650cc7bd9cb9917a18e4f16830", features = ["datom"] }
meta-signal-persona   = { git = "https://github.com/LiGoldragon/meta-signal-persona.git", rev = "bfe4c964b096637166f46c759aad69456186e85f", features = ["datom"] }
rkyv                   = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
sema-engine            = { git = "https://github.com/LiGoldragon/sema-engine.git", rev = "516f01fe0b03157efc6cc3d38b588f0ca123ac94" }
signal-harness            = { git = "https://github.com/LiGoldragon/signal-harness.git", rev = "17bdd58bebe230548ff278ee394f89bbecc6ce86", features = ["datom"] }
signal-introspect         = { git = "https://github.com/LiGoldragon/signal-introspect.git", rev = "ccea830fc5648270e8a90a044299424009862eec", features = ["datom"] }
signal-message            = { git = "https://github.com/LiGoldragon/signal-message.git", rev = "f692865ae9620d6b6bb5a140d9721e50fdc64b03", features = ["datom"] }
signal-mind               = { git = "https://github.com/LiGoldragon/signal-mind.git", rev = "5d5352b2ef2655dabe6b0def6183020ed5de9849", features = ["datom"] }
signal-persona            = { git = "https://github.com/LiGoldragon/signal-persona.git", rev = "5ed07a66d473f4fff7b293102023fc26588a3d94", features = ["datom"] }
signal-router             = { git = "https://github.com/LiGoldragon/signal-router.git", rev = "f8fd16446d1f1a6fff3a4545adca145e4a9379e7" }
signal-system             = { git = "https://github.com/LiGoldragon/signal-system.git", rev = "5ae2944e343cf3deee2d20766256ba1d8e485956", features = ["datom"] }
signal-upgrade            = { git = "https://github.com/LiGoldragon/signal-upgrade.git", rev = "4762886625ea4161e489d055418c67db06aecaac", features = ["datom"] }
signal-terminal           = { git = "https://github.com/LiGoldragon/signal-terminal.git", rev = "82ffb06a0c3cf2af31d4a0e59e1e15dd5efa5905", features = ["datom"] }
strum                  = { version = "0.28", features = ["derive"] }
thiserror              = "2"
tokio                  = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "process", "time"] }
triad-runtime          = { git = "https://github.com/LiGoldragon/triad-runtime.git", rev = "b7cffcb25eb8e192add65af3df8c67fe06fc59b1" }
unix-ancillary         = "0.2"
version-projection     = { git = "https://github.com/LiGoldragon/version-projection.git", rev = "a6a79025cb28b02008a55481e2fc78047e45505e" }
zbus                   = { version = "5.15", default-features = false, features = ["tokio"] }

# ─── Wire-test shim binaries (for nix-chained tests) ──────
# These exercise signal-message end-to-end through
# real bytes on stdout/stdin.

[[bin]]
name = "wire-emit-message"
path = "src/bin/wire_emit_message.rs"

[[bin]]
name = "wire-decode-message"
path = "src/bin/wire_decode_message.rs"

[[bin]]
name = "wire-emit-message-reply"
path = "src/bin/wire_emit_message_reply.rs"

[[bin]]
name = "wire-decode-message-reply"
path = "src/bin/wire_decode_message_reply.rs"

[[bin]]
name = "wire-router-client"
path = "src/bin/wire_router_client.rs"

[[bin]]
name = "wire-tap-router"
path = "src/bin/wire_tap_router.rs"

[[bin]]
name = "persona-component-fixture"
path = "src/bin/persona_component_fixture.rs"

[lints.rust]
unused = "warn"
dead_code = "warn"

[patch.crates-io]
kameo = { git = "https://github.com/LiGoldragon/kameo.git", rev = "3486e4f63ea4e87123476cfbdefeb12403540306" }
