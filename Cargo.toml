[package]
name         = "persona"
version      = "0.4.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/persona"
description  = "Engine manager and apex integration repo for multi-harness AI systems."

[lib]
name = "persona"
path = "src/lib.rs"

[[bin]]
name = "persona"
path = "src/main.rs"

[[bin]]
name = "persona-daemon"
path = "src/bin/persona_daemon.rs"

[[bin]]
name = "persona-write-configuration"
path = "src/bin/persona_write_configuration.rs"

[dependencies]
kameo                  = { git = "https://github.com/LiGoldragon/kameo.git", rev = "3486e4f63ea4e87123476cfbdefeb12403540306", default-features = false }
datom-codec            = { git = "https://github.com/LiGoldragon/datom-codec", rev = "627db67f2655efd9f786864009955005fd8ab2ad" }
libc                   = "0.2"
protos                 = { git = "https://github.com/LiGoldragon/protos", rev = "171b21f65337983ab624b7b906397a4f1f92c5a3" }
meta-signal-upgrade    = { git = "https://github.com/LiGoldragon/meta-signal-upgrade.git", rev = "a319e1ba35aedec650aeeffdcb1378e495aa9407", features = ["datom"] }
dotos             = { package = "dotos", git = "https://github.com/LiGoldragon/dotos.git", rev = "80c7b17f7ad3cf547d2624c6a243e5de5f85c9f3" }
meta-signal-system    = { git = "https://github.com/LiGoldragon/meta-signal-system.git", rev = "17591d96dd770b7a1c30dc895aa7a26e7534eeb5", features = ["datom"] }
meta-signal-persona   = { git = "https://github.com/LiGoldragon/meta-signal-persona.git", rev = "88657088a4f499c758bc3af3e625ab7e7618e038", features = ["datom"] }
rkyv                   = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
sema-engine            = { git = "https://github.com/LiGoldragon/sema-engine.git", rev = "27e814a721439af67721c530d48b4d2101141f74" }
signal-frame           = { git = "https://github.com/LiGoldragon/signal-frame.git", rev = "000d86684d91ab6b38dd0bce7a5d8bae6db7b147" }
signal-harness            = { git = "https://github.com/LiGoldragon/signal-harness.git", rev = "49d16a31c0dd81a571de99db739e428d96819fd9", features = ["datom"] }
signal-introspect         = { git = "https://github.com/LiGoldragon/signal-introspect.git", rev = "8de16e35a1aa993b059fcab72a2c2aa4b3a785bf", features = ["datom"] }
signal-message            = { git = "https://github.com/LiGoldragon/signal-message.git", rev = "2da9c6dde92dda11ba53aedaa75a3f3605b51454", features = ["datom"] }
signal-mind               = { git = "https://github.com/LiGoldragon/signal-mind.git", rev = "7a08e51d43f86a00a10a0133432ff763c7fd0d67", features = ["datom"] }
signal-persona            = { git = "https://github.com/LiGoldragon/signal-persona.git", rev = "48118557368f26b7292f6b0fb2f98df5cec29fc5", features = ["datom"] }
signal-router             = { git = "https://github.com/LiGoldragon/signal-router.git", rev = "03ed6bc2217d6a8d0ed5e1291e417ea4d4de168f" }
signal-system             = { git = "https://github.com/LiGoldragon/signal-system.git", rev = "603923142ba44331eb674f5d8641f5972051288b", features = ["datom"] }
signal-upgrade            = { git = "https://github.com/LiGoldragon/signal-upgrade.git", rev = "b1bec686f4067fb1be16b47120b47225d1bf8d20", features = ["datom"] }
signal-terminal           = { git = "https://github.com/LiGoldragon/signal-terminal.git", rev = "bb6963650cdd507c25b3650d85fd3bfc232f9a07", features = ["datom"] }
strum                  = { version = "0.28", features = ["derive"] }
thiserror              = "2"
tokio                  = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "process", "time"] }
triad-runtime          = { git = "https://github.com/LiGoldragon/triad-runtime.git", rev = "02cdd49df63a1769b3cf1b2761261a87eeaa75a4" }
unix-ancillary         = "0.2"
version-projection     = { git = "https://github.com/LiGoldragon/version-projection.git", rev = "a6a79025cb28b02008a55481e2fc78047e45505e" }
zbus                   = { version = "5.15", default-features = false, features = ["tokio"] }


[dev-dependencies]

# ─── Wire-test shim binaries (for nix-chained tests) ──────
# These exercise signal-message end-to-end through
# real bytes on stdout/stdin.

[[bin]]
name = "wire-emit-message"
path = "src/bin/wire_emit_message.rs"

[[bin]]
name = "wire-decode-message"
path = "src/bin/wire_decode_message.rs"

[[bin]]
name = "wire-emit-message-reply"
path = "src/bin/wire_emit_message_reply.rs"

[[bin]]
name = "wire-decode-message-reply"
path = "src/bin/wire_decode_message_reply.rs"

[[bin]]
name = "wire-router-client"
path = "src/bin/wire_router_client.rs"

[[bin]]
name = "wire-tap-router"
path = "src/bin/wire_tap_router.rs"

[[bin]]
name = "persona-component-fixture"
path = "src/bin/persona_component_fixture.rs"

[lints.rust]
unused = "warn"
dead_code = "warn"

[patch.crates-io]
kameo = { git = "https://github.com/LiGoldragon/kameo.git", rev = "3486e4f63ea4e87123476cfbdefeb12403540306" }
